name: Render animated profile banner

on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_profile_comic_gif.py'
      - '.github/workflows/render-profile-banner.yml'
      - 'assets/asse.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render optimized GIF and report errors
        shell: bash
        run: |
          sudo apt-get update -qq\n          sudo apt-get install -y -qq ffmpeg\n          python -m pip install --quiet Pillow
          if python scripts/render_profile_comic_gif.py > /tmp/banner_render_log.txt 2>&1; then
            cat /tmp/banner_render_log.txt
            rm -f assets/banner-render-error.txt
          else
            cat /tmp/banner_render_log.txt
            cp /tmp/banner_render_log.txt assets/banner-render-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/banner-render-error.txt
            git commit -m "Log profile banner render diagnostic"
            git push
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/berserk-comic-banner.gif assets/banner-render-error.txt
          git diff --cached --quiet || (git commit -m "Render animated profile comic banner" && git push)
