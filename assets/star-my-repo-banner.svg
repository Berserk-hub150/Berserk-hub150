<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">STAR MY REPO</title>
  <desc id="desc">Open-source projects by Berserk-hub150: AI Skill Navigator and SkillHawk</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.55" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#030405"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd54a"/>
      <stop offset="1" stop-color="#f2a900"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1800" height="600" rx="28" fill="url(#bg)"/>
  <rect width="1800" height="600" rx="28" fill="url(#grid)"/>
  <path d="M0 90 L400 0 L290 210 L0 330 Z" fill="#fff" opacity="0.035"/>
  <path d="M0 410 L500 40 L360 480 L0 585 Z" fill="#fff" opacity="0.025"/>
  <path d="M1800 80 L1410 0 L1540 220 L1800 300 Z" fill="#fff" opacity="0.025"/>

  <!-- manga/ink energy lines -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="4">
    <path d="M40 100L340 245"/><path d="M15 155L330 275"/><path d="M70 50L360 220"/>
    <path d="M1760 95L1460 245"/><path d="M1790 155L1470 275"/><path d="M1735 45L1440 220"/>
  </g>

  <!-- code texture -->
  <g fill="#c9d1d9" opacity="0.15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">
    <text x="55" y="410">def collaborate():</text>
    <text x="55" y="444">  build_together()</text>
    <text x="55" y="478">  make_impact()</text>
    <text x="1450" y="410">git push origin impact</text>
    <text x="1450" y="444"># open source</text>
    <text x="1450" y="478">share_knowledge()</text>
  </g>

  <!-- GitHub-style mark -->
  <circle cx="900" cy="73" r="43" fill="#0d1117" stroke="#30363d" stroke-width="3"/>
  <circle cx="900" cy="73" r="20" fill="none" stroke="#8b949e" stroke-width="4"/>
  <path d="M889 78c7 7 15 7 22 0" fill="none" stroke="#8b949e" stroke-width="4" stroke-linecap="round"/>

  <!-- stars -->
  <g fill="url(#gold)" filter="url(#glow)">
    <path d="M350 167l14 29 32 5-23 23 6 32-29-15-29 15 6-32-23-23 32-5z"/>
    <path d="M1450 167l14 29 32 5-23 23 6 32-29-15-29 15 6-32-23-23 32-5z"/>
  </g>

  <!-- headline -->
  <text x="900" y="245" text-anchor="middle" fill="#f0f6fc"
        font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"
        font-size="132" font-weight="900" letter-spacing="5">STAR MY REPO</text>
  <rect x="510" y="270" width="780" height="2" fill="#8b949e" opacity="0.65"/>

  <text x="900" y="323" text-anchor="middle" fill="#c9d1d9"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="36">Open-source projects by <tspan fill="#f2b72b" font-weight="700">Berserk-hub150</tspan></text>

  <!-- project cards -->
  <g transform="translate(390 365)">
    <rect width="470" height="122" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <circle cx="63" cy="61" r="35" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <path d="M63 35v52M37 61h52M45 43l36 36M81 43L45 79" stroke="#f0f6fc" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <text x="120" y="55" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="34" font-weight="800">AI Skill Navigator</text>
    <text x="120" y="90" fill="#8b949e" font-family="Arial, sans-serif" font-size="22">Moodle + AI learning tools</text>
  </g>

  <g transform="translate(940 365)">
    <rect width="470" height="122" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <circle cx="63" cy="61" r="35" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <path d="M38 68c20-33 55-37 72-15-19-5-33 3-43 15 14-7 26-6 38-1-15 19-37 25-67 1z" fill="#f0f6fc" opacity="0.92"/>
    <text x="120" y="55" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="34" font-weight="800">SkillHawk</text>
    <text x="120" y="90" fill="#8b949e" font-family="Arial, sans-serif" font-size="22">AI Agent Skills security scanner</text>
  </g>

  <!-- CTA -->
  <rect x="580" y="520" width="640" height="55" rx="27" fill="#f2b72b" opacity="0.11" stroke="#f2b72b" stroke-width="2"/>
  <text x="900" y="557" text-anchor="middle" fill="#f2b72b"
        font-family="Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="2">★ STAR THE REPO ★</text>
</svg>
